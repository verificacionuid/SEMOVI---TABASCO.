<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Permite que la página se adapte al tamaño real de la pantalla del celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gafete Válido Registrado</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #f4f4f4;
    }

    body {
      display: flex;
      justify-content: center; /* Centra horizontalmente */
      align-items: center;     /* Centra verticalmente */
      padding: 10px;
    }

    /* Ajuste para que la imagen no sobrepase la pantalla del celular */
    .imagen-gafete {
      max-width: 100%;
      max-height: 95vh;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>

  <!-- Usa la ruta directa de la imagen alojada en tu mismo repositorio -->
  <img src="./mi_gafete.jpg" alt="Gafete Válido" class="imagen-gafete" onerror="this.onerror=null; this.src='mi_gafete.jpg';">

</body>
</html>
